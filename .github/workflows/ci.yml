name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          npm ci
          python -m pip install --quiet numpy

      - name: 类型检查（strict）
        run: npm run check

      - name: 构建
        run: npm run build

      - name: 谱面可弹性校验
        run: npm run validate

      - name: 音频回归测试
        run: npm test

      - name: 谱集能重新生成
        run: |
          npm run book
          git diff --exit-code guitar-arpeggio-patterns.txt
